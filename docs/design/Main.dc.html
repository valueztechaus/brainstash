<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brainstash Inbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;family=Fira+Code:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#F5B83D}a:hover{color:#FFD27A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1115; color: #ECEEF2; font-family: 'Fira Sans', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<div style="padding: 60px 20px 12px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.5px">Brainstash</h1>
<button aria-label="Settings" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #1A1D24; color: #A8AEBB; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></button>
</div>
<label style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; background: #1A1D24; border-radius: 12px; color: #8C93A1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input placeholder="Search ideas" aria-label="Search ideas" style="flex: 1; background: transparent; border: 0; color: #ECEEF2; font: inherit; font-size: 16px; outline: none"></label>
<div style="display: flex; gap: 8px; overflow: hidden">
<button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 0; background: #F5B83D; color: #1A1406; font: inherit; font-size: 14px; font-weight: 600">All · 12</button>
<button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid #2A2E37; background: transparent; color: #C9CDD5; font: inherit; font-size: 14px">Product</button>
<button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid #2A2E37; background: transparent; color: #C9CDD5; font: inherit; font-size: 14px">Service</button>
<button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid #2A2E37; background: transparent; color: #C9CDD5; font: inherit; font-size: 14px">Problem</button>
</div>
</div>
<div style="flex: 1; padding: 4px 20px 120px; display: flex; flex-direction: column; gap: 10px">
<div style="font-family: 'Fira Code', monospace; font-size: 12px; color: #8C93A1; letter-spacing: 1px; padding: 6px 0">THIS WEEK</div>
<sc-for list="{{ideas}}" as="idea" hint-placeholder-count="4">
<a href="Detail.dc.html" style="display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; background: #171A20; border: 1px solid #23262E; border-radius: 14px; color: #ECEEF2; text-decoration: none">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<span style="font-size: 16px; font-weight: 600; line-height: 1.3">{{idea.title}}</span>
<sc-if value="{{idea.starred}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="#F5B83D" role="img" aria-label="Starred"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"></path></svg></sc-if>
</div>
<span style="font-size: 14px; color: #A8AEBB; line-height: 1.4">{{idea.snippet}}</span>
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px">
<span style="padding: 3px 8px; border-radius: 6px; background: {{idea.typeBg}}; color: {{idea.typeFg}}; font-weight: 600">{{idea.type}}</span>
<span style="padding: 3px 8px; border-radius: 6px; background: #22252D; color: #C9CDD5">{{idea.status}}</span>
<span style="margin-left: auto; font-family: 'Fira Code', monospace; color: #8C93A1">{{idea.when}}</span>
</div>
</a>
</sc-for>
</div>
<a href="Capture.dc.html" aria-label="Capture new idea" style="position: absolute; right: 20px; bottom: 40px; width: 64px; height: 64px; border-radius: 32px; background: #F5B83D; color: #1A1406; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(245,184,61,0.3)"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const t = {
Product: ['#2B2312', '#F5B83D'],
Service: ['#132433', '#6FB4F0'],
Problem: ['#2E1A1A', '#F08A7A'],
Other: ['#22252D', '#C9CDD5']
};
const raw = [
{ title: 'Offline job-plan checker', snippet: 'Validate Maximo job plans for missing safety steps before upload.', type: 'Product', status: 'Spark', when: '2h', starred: true },
{ title: 'Asset health review service', snippet: 'Quarterly review package for utilities clients.', type: 'Service', status: 'Exploring', when: 'Mon', starred: false },
{ title: 'Field techs lose notes', snippet: 'Paper notes never make it back into the work order.', type: 'Problem', status: 'Spark', when: 'Sun', starred: false },
{ title: 'Voice-first inspection log', snippet: 'Hands-free capture for crews wearing gloves.', type: 'Product', status: 'Ready', when: 'Sat', starred: true }
];
return { ideas: raw.map((i) => ({ ...i, typeBg: t[i.type][0], typeFg: t[i.type][1] })) };
}
}
</script>
</body>
</html>
